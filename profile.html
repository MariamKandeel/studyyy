<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="profile.css">
</head>

<body>
    <a href="courses.html" class="courses-btn">
        <i class="fas fa-book"></i>
        Courses
      </a>
  <div class="profile-page">
    <button id="logoutBtn" style="position:fixed;right:24px;top:24px;padding:10px 16px;border:0;border-radius:10px;background:#000;color:#fff;cursor:pointer;font-weight:600;z-index:10;">
      <i class="fas fa-right-from-bracket"></i> Log Out
    </button>
    <!-- Your profile content here -->
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="blueflow-auth.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await BlueFlowFirebase.auth.signOut();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
