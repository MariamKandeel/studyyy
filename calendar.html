<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joe's Calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <main class="calendar-page">
    <header class="calendar-header">
      <div>
        <a href="courses.html" class="calendar-back"><i class="fas fa-arrow-left"></i> Courses</a>
        
        <h1>Your Calendar</h1>
        <p class="subtitle">Keep your deadlines, exams and important dates in one place.</p>
      </div>
      <div class="header-actions">
        <button class="secondary-btn" id="todayBtn"><i class="fas fa-calendar-day"></i> Today</button>
        <button class="primary-btn" id="addEventBtn"><i class="fas fa-plus"></i> Add Deadline</button>
      </div>
    </header>

    <section class="calendar-layout">
      <div class="calendar-card">
        <div class="month-bar">
          <div>
            <h2 id="monthTitle"></h2>
            <span id="eventCount"></span>
          </div>
          <div class="month-nav">
            <button id="prevMonth" aria-label="Previous month"><i class="fas fa-chevron-left"></i></button>
            <button id="nextMonth" aria-label="Next month"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <aside class="upcoming-card">
        <div class="side-heading">
          <div><p class="eyebrow">STAY ON TRACK</p><h2>Upcoming</h2></div>
          <span class="upcoming-count" id="upcomingCount">0</span>
        </div>
        <div id="upcomingList" class="upcoming-list"></div>
      </aside>
    </section>
  </main>

  <div class="modal" id="eventModal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
      <p class="eyebrow">CALENDAR EVENT</p>
      <h2 id="modalTitle">Add Deadline</h2>
      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <div class="form-group"><label for="eventTitle">Title</label><input id="eventTitle" type="text" placeholder="e.g. one challenge" required /></div>
        <div class="form-row">
          <div class="form-group"><label for="eventDate">Date</label><input id="eventDate" type="date" required /></div>
          <div class="form-group"><label for="eventTime">Time</label><input id="eventTime" type="time" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="eventType">Type</label><select id="eventType"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select></div>
          <div class="form-group"><label for="eventPriority">Priority</label><select id="eventPriority"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select></div>
        </div>
        <div class="form-group"><label for="eventNotes">Notes <span>(optional)</span></label><textarea id="eventNotes" rows="3" placeholder="Anything you want to remember..."></textarea></div>
        <p class="form-error" id="formError"></p>
        <div class="modal-actions"><button type="button" class="secondary-btn" id="cancelBtn">Cancel</button><button type="submit" class="primary-btn">Save Event</button></div>
      </form>
    </div>
  </div>

  <div class="modal delete-modal" id="deleteModal" aria-hidden="true">
    <div class="modal-content delete-modal-content">
      <button class="modal-close" id="closeDeleteModal" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button>
      <div class="delete-icon"><i class="fas fa-trash-can"></i></div>
      <p class="eyebrow">REMOVE DEADLINE</p>
      <h2>Delete this deadline?</h2>
      <p class="delete-message">Are you sure you want to remove <strong id="deleteEventName">this deadline</strong>? This action cannot be undone.</p>
      <input type="hidden" id="deleteEventId" />
      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="cancelDeleteBtn">Cancel</button>
        <button type="button" class="delete-confirm-btn" id="confirmDeleteBtn"><i class="fas fa-trash-can"></i> Delete</button>
      </div>
    </div>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
